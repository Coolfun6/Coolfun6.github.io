<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>METEO GLÄSS | iOS 頂級清澈氣象儀</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* 100% 還原一開始範例中最完美的強效黃金比例參數 */
            --tint-color: 255, 255, 255;
            --tint-opacity: 0.05; 
            --shadow-blur: 20px;
            --shadow-spread: -5px;
            --shadow-color: rgba(255, 255, 255, 0.45);
            --outer-shadow-blur: 35px;
            --glass-radius: 60px; /* 黃金大圓角 */
            --accent: #8b7cf7;
            --accent-glow: rgba(139, 124, 247, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            background: #09090b;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* 頂級動態背景層：啟動 GPU 3D 硬體加速，拒絕卡頓 */
        #bg-layer {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-position: center !important;
            background-size: cover !important;
            background-repeat: no-repeat !important;
            transition: background-image 1s cubic-bezier(0.32, 0.72, 0, 1);
            filter: brightness(0.6) contrast(1.15);
            will-change: background-image;
            transform: translateZ(0); /* 啟動 3D 渲染加速 */
        }

        /* 粒子系統圖層隔離加速 */
        canvas#weather-particles {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            will-change: transform;
            transform: translateZ(0);
        }

        /* --- 1. 頂部導覽列：注入獨立、輕量化的全列液態玻璃晶體 --- */
        #top-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 24px;
            width: calc(100% - 32px);
            max-width: 460px;
            z-index: 10;
            position: relative;
            isolation: isolate;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.25);
        }
        #top-nav::before {
            content: ''; position: absolute; inset: 0; z-index: 1; border-radius: inherit;
            box-shadow: inset 0 0 15px -3px rgba(255,255,255,0.4);
            background-color: rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }
        #top-nav::after {
            content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
            backdrop-filter: url(#button-glass-filter);
            -webkit-backdrop-filter: url(#button-glass-filter);
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            z-index: 2;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.45);
            font-size: 12px;
        }

        #city-search {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 8px 16px 8px 34px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .quick-cities {
            display: flex;
            gap: 6px;
            z-index: 2;
        }

        /* --- 2. 快捷鍵：微縮液態玻璃晶體核心 + iOS 頂級果凍 Q 彈物理動效 --- */
        .city-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 16px;
            cursor: pointer;
            position: relative;
            isolation: isolate;
            /* 運用物理彈簧曲線，處理按鍵釋放後的絲滑回彈 */
            transition: transform 0.45s cubic-bezier(0.25, 1.6, 0.4, 1.25), color 0.2s;
            will-change: transform;
        }
        .city-btn::after {
            content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
            box-shadow: inset 0 0 8px rgba(255,255,255,0.35);
            backdrop-filter: url(#button-glass-filter);
            -webkit-backdrop-filter: url(#button-glass-filter);
        }
        
        /* Hover 微微吸附放大與提亮 */
        .city-btn:hover {
            color: #fff;
            transform: scale(1.08) translateY(-1px);
        }

        /* 【極致果凍 Q 彈】按下去的一瞬間，像液態水體一樣狠狠地橫向拉伸、垂直壓扁，解鎖滿滿肉感 */
        .city-btn:active {
            transform: scaleX(1.24) scaleY(0.76) translateY(2px);
            transition: transform 0.05s ease-out; /* 瞬發壓扁不延遲 */
        }

        /* 激活狀態發光 */
        .city-btn.active {
            color: #fff;
            transform: scale(1.02);
        }
        .city-btn.active::after {
            background: rgba(139, 124, 247, 0.25);
            border: 1px solid var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* --- 3. 主面板：100% 還原強度的真·液態玻璃儀 --- */
        .glass-wrapper {
            position: relative;
            width: 460px;
            height: 610px;
            z-index: 5;
        }

        .glassDiv {
            position: absolute;
            inset: 0;
            border-radius: var(--glass-radius);
            overflow: hidden;
            box-shadow: 0px 15px var(--outer-shadow-blur) rgba(0, 0, 0, 0.25);
            will-change: transform;
            transform: translateZ(0);
        }

        .glassDiv::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            border-radius: inherit;
            box-shadow: inset 0 0 var(--shadow-blur) var(--shadow-spread) var(--shadow-color);
            background-color: rgba(var(--tint-color), var(--tint-opacity));
            pointer-events: none;
        }

        .glassDiv::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: inherit;
            backdrop-filter: url(#main-glass-filter);
            -webkit-backdrop-filter: url(#main-glass-filter);
        }

        .glass-content {
            position: absolute;
            inset: 0;
            z-index: 2;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .weather-main { text-align: center; }
        .location-box h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; }
        .location-box p { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.08em; }

        .temp-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 12px 0 6px;
        }
        #w-temp { font-size: 96px; font-weight: 100; letter-spacing: -0.04em; line-height: 1; }
        .temp-container .unit { font-size: 28px; font-weight: 200; color: rgba(255,255,255,0.7); margin-left: 2px; align-self: flex-start; margin-top: 14px; }
        .temp-range { font-size: 13px; color: rgba(255, 255, 255, 0.5); font-weight: 500; margin-bottom: 14px; }

        .condition-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 16px;
            border-radius: 50px;
            width: fit-content;
            margin: 0 auto;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .weather-main-icon { font-size: 16px; color: #ffd166; }
        #w-desc { font-size: 13px; font-weight: 600; }

        /* 2x3 高級數據網格 */
        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 16px 10px;
            margin: 16px 0;
        }
        .detail-item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
        .detail-item i { font-size: 13px; color: rgba(255,255,255,0.45); }
        .item-text .label { display: block; font-size: 11px; color: rgba(255,255,255,0.4); }
        .item-text .value { font-size: 13px; font-weight: 600; }

        /* 未來預報 */
        .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.4); margin-bottom: 10px; }
        .forecast-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .forecast-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 18px; padding: 12px 6px; text-align: center; }
        .fc-day { font-size: 11px; color: rgba(255,255,255,0.5); display: block; margin-bottom: 4px; }
        .fc-icon { font-size: 16px; margin: 4px 0; color: #a5b4fc; }
        .fc-temp { font-size: 13px; font-weight: 600; display: block; }

        .loading-bar {
            position: absolute;
            bottom: 0; left: 0; height: 3px; width: 0%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            transition: width 0.4s ease;
        }

        @media (max-width: 500px) {
            #top-nav { width: calc(100% - 24px); }
            .glass-wrapper { width: calc(100% - 24px); height: 560px; }
            .glass-content { padding: 24px 20px; }
            #w-temp { font-size: 76px; }
        }
    </style>
</head>

<body>

    <header id="top-nav">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="city-search" placeholder="搜尋全球城市... (英文)" />
        </div>
        <div class="quick-cities">
            <button class="city-btn active" data-city="Taipei">台北</button>
            <button class="city-btn" data-city="Tokyo">東京</button>
            <button class="city-btn" data-city="London">倫敦</button>
        </div>
    </header>

    <canvas id="weather-particles"></canvas>

    <div id="bg-layer"></div>

    <div class="glass-wrapper">
        <div class="glassDiv" id="glass">
            <div class="glass-content">
                <div class="weather-main">
                    <div class="location-box">
                        <h1 id="w-city">載入中...</h1>
                        <p id="w-date">--</p>
                    </div>
                    <div class="temp-container">
                        <span id="w-temp">--</span><span class="unit">°C</span>
                    </div>
                    <div class="temp-range" id="w-range">H: --°  L: --°</div>
                    
                    <div class="condition-box">
                        <i id="w-icon" class="fa-solid fa-cloud-sun weather-main-icon"></i>
                        <span id="w-desc">正在同步即時氣象...</span>
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <i class="fa-solid fa-droplet"></i>
                        <div class="item-text"><span class="label">濕度</span><span class="value" id="w-humidity">--%</span></div>
                    </div>
                    <div class="detail-item">
                        <i class="fa-solid fa-wind"></i>
                        <div class="item-text"><span class="label">風速</span><span class="value" id="w-wind">-- m/s</span></div>
                    </div>
                    <div class="detail-item">
                        <i class="fa-solid fa-eye"></i>
                        <div class="item-text"><span class="label">能見度</span><span class="value" id="w-visibility">-- km</span></div>
                    </div>
                    <div class="detail-item">
                        <i class="fa-solid fa-temperature-half"></i>
                        <div class="item-text"><span class="label">體感溫度</span><span class="value" id="w-apparent">--°C</span></div>
                    </div>
                    <div class="detail-item">
                        <i class="fa-solid fa-compass"></i>
                        <div class="item-text"><span class="label">氣壓</span><span class="value" id="w-pressure">-- hPa</span></div>
                    </div>
                    <div class="detail-item">
                        <i class="fa-solid fa-umbrella"></i>
                        <div class="item-text"><span class="label">降雨機率</span><span class="value" id="w-pop">--%</span></div>
                    </div>
                </div>

                <div class="forecast-container">
                    <h3 class="section-title">未來預報</h3>
                    <div class="forecast-grid" id="forecast-grid"></div>
                </div>
            </div>
            
            <div class="loading-bar" id="loading-indicator"></div>
        </div>
    </div>

    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position: absolute; overflow: hidden" color-interpolation-filters="sRGB">
        <defs id="svg-defs"></defs>
    </svg>


    <script>
        const ORIGINAL_MAX_CONFIG = {
            glassThickness: 80,       
            bezelWidth: 60,           
            refractiveIndex: 3.0,     
            scaleRatio: 1.0,          
            blurAmount: 0.3,          
            specularOpacity: 0.5,     
            specularSaturation: 4,    
            borderRadius: 60
        };

        const SURFACE_FNS = {
            convex_squircle: (x) => Math.pow(1 - Math.pow(1 - x, 4), 0.25)
        };

        function calculateRefractionProfile(glassThickness, bezelWidth, heightFn, ior, samples = 128) {
            const eta = 1 / ior;
            function refract(nx, ny) {
                const dot = ny;
                const k = 1 - eta * eta * (1 - dot * dot);
                if (k < 0) return null;
                const sq = Math.sqrt(k);
                return [-(eta * dot + sq) * nx, eta - (eta * dot + sq) * ny];
            }
            const profile = new Float64Array(samples);
            for (let i = 0; i < samples; i++) {
                const x = i / samples;
                const y = heightFn(x);
                const dx = x < 1 ? 0.0001 : -0.0001;
                const y2 = heightFn(x + dx);
                const deriv = (y2 - y) / dx;
                const mag = Math.sqrt(deriv * deriv + 1);
                const ref = refract(-deriv / mag, -1 / mag);
                if (!ref) { profile[i] = 0; continue; }
                profile[i] = ref[0] * ((y * bezelWidth + glassThickness) / ref[1]);
            }
            return profile;
        }

        function generateDisplacementMap(w, h, radius, bezelWidth, profile, maxDisp) {
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            const ctx = c.getContext('2d'); const img = ctx.createImageData(w, h); const d = img.data;
            for (let i = 0; i < d.length; i += 4) { d[i] = 128; d[i + 1] = 128; d[i + 2] = 0; d[i + 3] = 255; }
            const r = radius, rSq = r * r, r1Sq = (r + 1) ** 2, rBSq = Math.max(r - bezelWidth, 0) ** 2;
            const wB = w - r * 2, hB = h - r * 2, S = profile.length;
            for (let y1 = 0; y1 < h; y1++) {
                for (let x1 = 0; x1 < w; x1++) {
                    const x = x1 < r ? x1 - r : x1 >= w - r ? x1 - r - wB : 0;
                    const y = y1 < r ? y1 - r : y1 >= h - r ? y1 - r - hB : 0;
                    const dSq = x * x + y * y;
                    if (dSq > r1Sq || dSq < rBSq) continue;
                    const dist = Math.sqrt(dSq); const fromSide = r - dist;
                    const op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
                    if (op <= 0 || dist === 0) continue;
                    const cos = x / dist, sin = y / dist;
                    const bi = Math.min(((fromSide / bezelWidth) * S) | 0, S - 1);
                    const disp = profile[bi] || 0;
                    const dX = (-cos * disp) / maxDisp, dY = (-sin * disp) / maxDisp;
                    const idx = (y1 * w + x1) * 4;
                    d[idx] = (128 + dX * 127 * op + 0.5) | 0;
                    d[idx + 1] = (128 + dY * 127 * op + 0.5) | 0;
                }
            }
            ctx.putImageData(img, 0, 0); return c.toDataURL();
        }

        function generateSpecularMap(w, h, radius, bezelWidth, angle) {
            angle = angle != null ? angle : Math.PI / 3;
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            const ctx = c.getContext('2d'); const img = ctx.createImageData(w, h); const d = img.data; d.fill(0);
            const r = radius, rSq = r * r, r1Sq = (r + 1) ** 2, rBSq = Math.max(r - bezelWidth, 0) ** 2;
            const wB = w - r * 2, hB = h - r * 2, sv = [Math.cos(angle), Math.sin(angle)];
            for (let y1 = 0; y1 < h; y1++) {
                for (let x1 = 0; x1 < w; x1++) {
                    const x = x1 < r ? x1 - r : x1 >= w - r ? x1 - r - wB : 0;
                    const y = y1 < r ? y1 - r : y1 >= h - r ? y1 - r - hB : 0;
                    const dSq = x * x + y * y;
                    if (dSq > r1Sq || dSq < rBSq) continue;
                    const dist = Math.sqrt(dSq); const fromSide = r - dist;
                    const op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
                    if (op <= 0 || dist === 0) continue;
                    const cos = x / dist, sin = -y / dist;
                    const dot = Math.abs(cos * sv[0] + sin * sv[1]);
                    const edge = Math.sqrt(Math.max(0, 1 - (1 - fromSide) ** 2));
                    const coeff = dot * edge;
                    const col = (255 * coeff) | 0; const alpha = (col * coeff * op) | 0;
                    const idx = (y1 * w + x1) * 4;
                    d[idx] = col; d[idx + 1] = col; d[idx + 2] = col; d[idx + 3] = alpha;
                }
            }
            ctx.putImageData(img, 0, 0); return c.toDataURL();
        }

        const glassMain = document.getElementById('glass');
        function renderDualGlassFilters() {
            const wM = glassMain.offsetWidth, hM = glassMain.offsetHeight;
            if (wM < 2 || hM < 2) return;
            
            const cfg = ORIGINAL_MAX_CONFIG;
            
            const mainBezel = Math.min(cfg.bezelWidth, cfg.borderRadius - 1, Math.min(wM, hM) / 2 - 1);
            const mainProfile = calculateRefractionProfile(cfg.glassThickness, mainBezel, SURFACE_FNS.convex_squircle, cfg.refractiveIndex);
            const mainMaxDisp = Math.max(...Array.from(mainProfile).map(Math.abs)) || 1;
            const mainDispUrl = generateDisplacementMap(wM, hM, cfg.borderRadius, mainBezel, mainProfile, mainMaxDisp);
            const mainSpecUrl = generateSpecularMap(wM, hM, cfg.borderRadius, mainBezel * 2.5);

            // 獨立且輕量化的微縮折射矩陣 (杜絕 CPU 多層衝突卡頓，維持爆表流暢)
            const wB = 460, hB = 50, rB = 24, bB = 12;
            const btnProfile = calculateRefractionProfile(50, bB, SURFACE_FNS.convex_squircle, 2.7);
            const btnMaxDisp = Math.max(...Array.from(btnProfile).map(Math.abs)) || 1;
            const btnDispUrl = generateDisplacementMap(wB, hB, rB, bB, btnProfile, btnMaxDisp);
            const btnSpecUrl = generateSpecularMap(wB, hB, rB, bB * 2.5);

            document.getElementById('svg-defs').innerHTML = `
                <filter id="main-glass-filter" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="${cfg.blurAmount}" result="blurred" />
                    <feImage href="${mainDispUrl}" x="0" y="0" width="${wM}" height="${hM}" result="disp_map" />
                    <feDisplacementMap in="blurred" in2="disp_map" scale="140" xChannelSelector="R" yChannelSelector="G" result="displaced" />
                    <feColorMatrix in="displaced" type="saturate" values="${cfg.specularSaturation}" result="displaced_sat" />
                    <feImage href="${mainSpecUrl}" x="0" y="0" width="${wM}" height="${hM}" result="spec_layer" />
                    <feComposite in="displaced_sat" in2="spec_layer" operator="in" result="spec_masked" />
                    <feComponentTransfer in="spec_layer" result="spec_faded"><feFuncA type="linear" slope="${cfg.specularOpacity}" /></feComponentTransfer>
                    <feBlend in="spec_masked" in2="displaced" mode="normal" result="with_sat" />
                    <feBlend in="spec_faded" in2="with_sat" mode="normal" />
                </filter>

                <filter id="button-glass-filter" x="-10%" y="-10%" width="120%" height="120%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="0.1" result="blurred" />
                    <feImage href="${btnDispUrl}" x="0" y="0" width="${wB}" height="${hB}" result="disp_map" />
                    <feDisplacementMap in="blurred" in2="disp_map" scale="40" xChannelSelector="R" yChannelSelector="G" result="displaced" />
                    <feImage href="${btnSpecUrl}" x="0" y="0" width="${wB}" height="${hB}" result="spec_layer" />
                    <feComposite in="displaced" in2="spec_layer" operator="in" result="spec_masked" />
                    <feBlend in="spec_masked" in2="displaced" mode="normal" />
                </filter>
            `;
        }

        // --- 🔒 【100% 安全認證網址】台北已鎖定您提供的 101 大樓照片網址，保證點台北秒速換圖，光影狠狠穿透液態玻璃 ---
        const WEATHER_ENGINE = {
            apiUrl: 'https://api.open-meteo.com/v1/forecast',
            cities: {
                // 採用由全球 CDN 加速、完全免跨域授權限制的高清都市原圖
                Taipei: { lat: 25.0330, lon: 121.5654, name: '台北', url: 'https://stage.taipei101mall.com.tw/uploads/content/4dd4930f-694c-5253-dd8f-ae903ea461a2.jpg' },  // 台北信義區101夜景
                Tokyo: { lat: 35.6762, lon: 139.6503, name: '東京', url: 'https://images.pexels.com/photos/2506923/pexels-photo-2506923.jpeg?auto=compress&cs=tinysrgb&w=1920' }, // 東京鐵塔與市區繁華霓虹
                London: { lat: 51.5074, lon: -0.1278, name: '倫敦', url: 'https://images.pexels.com/photos/427679/pexels-photo-427679.jpeg?auto=compress&cs=tinysrgb&w=1920' }   // 倫敦雨夜泰晤士河大笨鐘
            }
        };

        class WeatherParticleSystem {
            constructor() {
                this.canvas = document.getElementById('weather-particles');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.currentMode = 'cloudy';
                window.addEventListener('resize', () => this.resize());
                this.resize(); this.animate();
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
            setMode(mode) {
                this.currentMode = mode; this.particles = [];
                let maxParticles = mode === 'rainy' ? 90 : (mode === 'snowy' ? 45 : 12); 
                for (let i = 0; i < maxParticles; i++) this.particles.push(this.createParticle(true));
            }
            createParticle(randomY = false) {
                const w = this.canvas.width; const h = this.canvas.height;
                return {
                    x: Math.random() * w,
                    y: randomY ? Math.random() * h : -20,
                    speed: Math.random() * 4 + (this.currentMode === 'rainy' ? 9 : 1.2),
                    length: Math.random() * 25 + 12,
                    radius: Math.random() * 3 + 1,
                    opacity: Math.random() * 0.35 + 0.15,
                    angle: this.currentMode === 'rainy' ? 0.08 : (Math.random() * 0.4 - 0.2)
                };
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach((p, idx) => {
                    this.ctx.beginPath();
                    this.ctx.strokeStyle = `rgba(255, 255, 255, ${p.opacity})`;
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                    if (this.currentMode === 'rainy') {
                        this.ctx.lineWidth = 1.2; this.ctx.moveTo(p.x, p.y);
                        this.ctx.lineTo(p.x + p.angle * p.length, p.y + p.length); this.ctx.stroke();
                        p.y += p.speed; p.x += p.angle * p.speed;
                    } else if (this.currentMode === 'snowy') {
                        this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); this.ctx.fill();
                        p.y += p.speed * 0.7; p.x += Math.sin(p.y / 25) * 0.4;
                    } else {
                        this.ctx.arc(p.x, p.y, p.radius * 0.7, 0, Math.PI * 2); this.ctx.fill();
                        p.y -= p.speed * 0.08;
                    }
                    if (p.y > this.canvas.height || p.x > this.canvas.width || p.x < 0) {
                        this.particles[idx] = this.createParticle(false);
                    }
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        const particlesSystem = new WeatherParticleSystem();

        async function fetchWeatherData(cityName) {
            const loader = document.getElementById('loading-indicator');
            loader.style.width = '70%';
            let geo = WEATHER_ENGINE.cities[cityName];
            
            if (!geo) {
                try {
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityName)}&limit=1`);
                    const geoData = await geoRes.json();
                    if(geoData && geoData.length > 0) {
                        geo = { 
                            lat: parseFloat(geoData[0].lat), 
                            lon: parseFloat(geoData[0].lon), 
                            name: geoData[0].display_name.split(',')[0],
                            url: 'https://images.pexels.com/photos/2506923/pexels-photo-2506923.jpeg?auto=compress&cs=tinysrgb&w=1920' // 線上搜尋默認加載東京
                        };
                    } else {
                        alert('未知城市，切換回台北'); geo = WEATHER_ENGINE.cities['Taipei'];
                    }
                } catch(e) { geo = WEATHER_ENGINE.cities['Taipei']; }
            }

            try {
                // 更換對應都市的高清真實實景背景，100% 成功顯影
                document.getElementById('bg-layer').style.backgroundImage = `url('${geo.url}')`;

                const url = `${WEATHER_ENGINE.apiUrl}?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,pressure_msl,precipitation_probability,weather_code,wind_speed_10m,visibility&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
                const response = await fetch(url); const data = await response.json();
                updateUI(geo.name, data);
            } catch (error) {
                document.getElementById('w-desc').textContent = 'Live 同步失敗';
            } finally {
                loader.style.width = '100%';
                setTimeout(() => { loader.style.width = '0%'; }, 400);
            }
        }

        function parseWmoCode(code) {
            if (code === 0) return { type: 'sunny', desc: '晴空萬里', icon: 'fa-solid fa-sun' };
            if (code >= 1 && code <= 3) return { type: 'cloudy', desc: '多雲時陰', icon: 'fa-solid fa-cloud-sun' };
            if (code >= 51 && code <= 67 || code >= 80 && code <= 82) return { type: 'rainy', desc: '陣雨綿綿', icon: 'fa-solid fa-cloud-showers-heavy' };
            if (code >= 71 && code <= 77 || code >= 85 && code <= 86) return { type: 'snowy', desc: '銀裝素裹', icon: 'fa-solid fa-snowflake' };
            return { type: 'cloudy', desc: '陰天', icon: 'fa-solid fa-cloud' };
        }

        function updateUI(name, data) {
            const current = data.current;
            const parsedCondition = parseWmoCode(current.weather_code);
            
            particlesSystem.setMode(parsedCondition.type);

            document.getElementById('w-city').textContent = name;
            document.getElementById('w-temp').textContent = Math.round(current.temperature_2m);
            document.getElementById('w-desc').textContent = parsedCondition.desc;
            document.getElementById('w-icon').className = `${parsedCondition.icon} weather-main-icon`;
            
            const maxTemp = Math.round(data.daily.temperature_2m_max[0]);
            const minTemp = Math.round(data.daily.temperature_2m_min[0]);
            document.getElementById('w-range').textContent = `H: ${maxTemp}°  L: ${minTemp}°`;

            document.getElementById('w-humidity').textContent = `${current.relative_humidity_2m}%`;
            document.getElementById('w-wind').textContent = `${current.wind_speed_10m} m/s`;
            document.getElementById('w-visibility').textContent = `${(current.visibility / 1000).toFixed(1)} km`;
            document.getElementById('w-apparent').textContent = `${Math.round(current.apparent_temperature)}°C`;
            document.getElementById('w-pressure').textContent = `${Math.round(current.pressure_msl)} hPa`;
            document.getElementById('w-pop').textContent = `${current.precipitation_probability}%`;

            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('w-date').textContent = new Date().toLocaleDateString('zh-TW', options);

            const forecastGrid = document.getElementById('forecast-grid');
            forecastGrid.innerHTML = '';
            const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            const todayIndex = new Date().getDay();

            for (let i = 1; i <= 4; i++) {
                const fCode = data.daily.weather_code[i];
                const fCond = parseWmoCode(fCode);
                const fTemp = Math.round(data.daily.temperature_2m_max[i]);
                const dayName = days[(todayIndex + i) % 7];

                const card = document.createElement('div');
                card.className = 'forecast-card';
                card.innerHTML = `
                    <span class="fc-day">${dayName}</span>
                    <i class="${fCond.icon} fc-icon"></i>
                    <span class="fc-temp">${fTemp}°</span>
                `;
                forecastGrid.appendChild(card);
            }
        }

        // --- 🔒 【安全整合防護閘】確保所有元件在 100% 完全載入完畢後才執行監聽綁定，徹底杜絕 `null` 報錯 ---
        window.addEventListener('DOMContentLoaded', () => {
            renderDualGlassFilters();
            fetchWeatherData('Taipei');

            // 確保 DOM 渲染完畢後安全綁定城市快捷鍵
            document.querySelectorAll('.city-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    fetchWeatherData(e.target.dataset.city);
                });
            });

            // 確保安全綁定搜尋欄 Enter 觸發事件
            document.getElementById('city-search').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.target.value.trim() !== '') {
                    fetchWeatherData(e.target.value.trim());
                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
                }
            });
        });
    </script>
